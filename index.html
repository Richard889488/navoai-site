<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Navoai 霧面慶祝賀卡</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      min-height: 100vh;

      overflow: hidden;

      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;

      background:

        radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 28%),

        radial-gradient(circle at 80% 20%, rgba(255,255,255,.32), transparent 26%),

        linear-gradient(135deg, #ffe6f2, #d9c6ff 42%, #7b2ff7 100%);

      display: flex;

      justify-content: center;

      align-items: center;

      color: #fff;

    }

    .page {

      position: relative;

      width: 100%;

      height: 100vh;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

    }

    .fog {

      position: absolute;

      width: 170vw;

      height: 170vh;

      background:

        radial-gradient(circle at 20% 40%, rgba(255,255,255,.34), transparent 28%),

        radial-gradient(circle at 60% 30%, rgba(255,255,255,.24), transparent 32%),

        radial-gradient(circle at 80% 70%, rgba(255,255,255,.28), transparent 30%);

      filter: blur(42px);

      animation: fogMove 18s ease-in-out infinite alternate;

      z-index: 1;

    }

    .card {

      position: relative;

      width: min(90vw, 540px);

      min-height: 620px;

      padding: 48px 36px;

      border-radius: 38px;

      background: rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(28px) saturate(1.35);

      -webkit-backdrop-filter: blur(28px) saturate(1.35);

      box-shadow:

        0 35px 90px rgba(60, 0, 120, 0.34),

        inset 0 0 0 1px rgba(255, 255, 255, 0.38),

        inset 0 28px 70px rgba(255, 255, 255, 0.16);

      text-align: center;

      animation: cardFloat 4s ease-in-out infinite;

      z-index: 5;

    }

    .card::before {

      content: "";

      position: absolute;

      inset: 1px;

      border-radius: 38px;

      background: linear-gradient(145deg, rgba(255,255,255,.38), transparent 42%, rgba(255,255,255,.14));

      pointer-events: none;

    }

    .badge {

      position: relative;

      display: inline-block;

      padding: 10px 22px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.24);

      backdrop-filter: blur(18px);

      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 28px;

      box-shadow: inset 0 0 0 1px rgba(255,255,255,.42);

    }

    h1 {

      position: relative;

      font-size: clamp(2.5rem, 8vw, 4.8rem);

      line-height: 1.05;

      margin-bottom: 20px;

      text-shadow: 0 8px 28px rgba(60, 0, 100, 0.35);

    }

    .message {

      position: relative;

      font-size: 1.2rem;

      line-height: 2;

      color: rgba(255, 255, 255, 0.94);

      margin-bottom: 36px;

    }

    .gift {

      position: relative;

      width: 150px;

      height: 135px;

      margin: 28px auto 36px;

      animation: giftBounce 1.5s ease-in-out infinite;

    }

    .gift-box {

      position: absolute;

      bottom: 0;

      width: 150px;

      height: 95px;

      border-radius: 18px;

      background: linear-gradient(135deg, rgba(255,71,126,.82), rgba(255,133,161,.62));

      backdrop-filter: blur(12px);

      box-shadow: 0 18px 32px rgba(100, 0, 70, 0.28);

    }

    .gift-lid {

      position: absolute;

      top: 12px;

      left: -8px;

      width: 166px;

      height: 38px;

      border-radius: 16px;

      background: linear-gradient(135deg, rgba(255,241,118,.9), rgba(255,193,7,.65));

      animation: lidOpen 2.4s ease-in-out infinite;

      transform-origin: left bottom;

    }

    .gift-ribbon-v {

      position: absolute;

      left: 60px;

      bottom: 0;

      width: 30px;

      height: 132px;

      background: rgba(255, 255, 255, 0.72);

      border-radius: 8px;

    }

    .gift-ribbon-h {

      position: absolute;

      left: 0;

      bottom: 42px;

      width: 150px;

      height: 24px;

      background: rgba(255, 255, 255, 0.72);

    }

    .button {

      position: relative;

      display: inline-block;

      padding: 15px 32px;

      border-radius: 999px;

      background: rgba(255,255,255,.72);

      backdrop-filter: blur(16px);

      color: #8f28f4;

      font-weight: 900;

      text-decoration: none;

      box-shadow:

        0 15px 35px rgba(90, 0, 130, 0.25),

        inset 0 0 0 1px rgba(255,255,255,.7);

      transition: 0.25s;

    }

    .button:hover {

      transform: translateY(-4px) scale(1.04);

    }

    .balloon {

      position: absolute;

      bottom: -210px;

      width: 72px;

      height: 94px;

      border-radius: 50% 50% 46% 46%;

      opacity: 0.82;

      filter: saturate(.9);

      backdrop-filter: blur(8px);

      animation: balloonUp linear infinite;

      z-index: 2;

    }

    .balloon::before {

      content: "";

      position: absolute;

      top: 14px;

      left: 18px;

      width: 18px;

      height: 32px;

      border-radius: 50%;

      background: rgba(255,255,255,.35);

      filter: blur(2px);

    }

    .balloon::after {

      content: "";

      position: absolute;

      left: 50%;

      top: 92px;

      width: 2px;

      height: 125px;

      background: rgba(255,255,255,0.5);

    }

    .b1 { left: 5%;  background: rgba(255,71,126,.62); animation-duration: 7s; animation-delay: -1s; }

    .b2 { left: 15%; background: rgba(255,209,102,.62); animation-duration: 9s; animation-delay: -4s; }

    .b3 { left: 27%; background: rgba(6,214,160,.58); animation-duration: 8s; animation-delay: -2s; }

    .b4 { left: 39%; background: rgba(76,201,240,.58); animation-duration: 10s; animation-delay: -6s; }

    .b5 { left: 52%; background: rgba(255,255,255,.46); animation-duration: 8.5s; animation-delay: -3s; }

    .b6 { left: 64%; background: rgba(255,118,181,.58); animation-duration: 9.5s; animation-delay: -5s; }

    .b7 { left: 76%; background: rgba(160,132,255,.6); animation-duration: 7.8s; animation-delay: -2.8s; }

    .b8 { left: 88%; background: rgba(255,241,118,.58); animation-duration: 10.5s; animation-delay: -7s; }

    @keyframes cardFloat {

      0%, 100% { transform: translateY(0); }

      50% { transform: translateY(-16px); }

    }

    @keyframes fogMove {

      0% { transform: translate(-8%, -4%) rotate(0deg); }

      100% { transform: translate(8%, 5%) rotate(8deg); }

    }

    @keyframes giftBounce {

      0%, 100% { transform: translateY(0) rotate(0deg); }

      50% { transform: translateY(-10px) rotate(2deg); }

    }

    @keyframes lidOpen {

      0%, 100% { transform: rotate(0deg); }

      50% { transform: rotate(-10deg) translateY(-8px); }

    }

    @keyframes balloonUp {

      0% {

        transform: translateY(0) translateX(0) rotate(0deg);

        opacity: 0;

      }

      8% {

        opacity: 0.85;

      }

      50% {

        transform: translateY(-65vh) translateX(28px) rotate(8deg);

      }

      100% {

        transform: translateY(-135vh) translateX(-22px) rotate(-8deg);

        opacity: 0;

      }

    }

    @media (max-width: 600px) {

      .card {

        min-height: 560px;

        padding: 38px 24px;

      }

      .message {

        font-size: 1rem;

      }

      .balloon {

        width: 58px;

        height: 78px;

      }

    }

  </style>

</head>

<body>

  <main class="page">

    <div class="fog"></div>

    <div class="balloon b1"></div>

    <div class="balloon b2"></div>

    <div class="balloon b3"></div>

    <div class="balloon b4"></div>

    <div class="balloon b5"></div>

    <div class="balloon b6"></div>

    <div class="balloon b7"></div>

    <div class="balloon b8"></div>

    <section class="card">

      <div class="badge">CELEBRATION</div>

      <h1>阿嬤生日快樂</h1>

      <div class="gift">

        <div class="gift-lid"></div>

        <div class="gift-box"></div>

        <div class="gift-ribbon-v"></div>

        <div class="gift-ribbon-h"></div>

      </div>

      <p class="message">

        祝您福如東海、壽比南山，<br>

        希望您每天開心，<br>

        把努力、祝福與新的開始一起收藏。

      </p>

      <a href="#" class="button">謝謝阿嬤每天跟阿公幫我送便當🍱</a>

    </section>

  </main>

</body>

</html>
